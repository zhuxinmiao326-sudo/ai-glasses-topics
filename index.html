  if (!idea) return { angle: '', hook: '' };

  const hookMatch = idea.match(/内容钩子[：:](.*?)$/s);

  const hook = hookMatch ? hookMatch[1].trim() : '';
  if (!angle && !hook) return { angle: idea, hook: '' };
  return { angle, hook };
}

        ${top3.map((item, i) => {
          const type = item.type === 'B' ? 'B' : 'A';
          const typeLabel = type === 'B' ? 'B轨·社会情绪' : 'A轨·热点借势';
          const audienceLine = item.target_audience ? ` · 人群：${item.target_audience}` : '';
          const sceneLine = item.scene ? ` · 场景：${item.scene}` : '';
          return `
          <div class="top3-item">
            <div class="rank">TOP ${i + 1}</div>
            <div class="title">${item.title}<span class="type-badge type-${type}">${typeLabel}</span></div>
            <div class="meta">蹭：${item.hotspot} · 难度：${item.difficulty}${audienceLine}${sceneLine}</div>
            <div class="stars">爆款指数：${renderStars(item.stars)}</div>
            ${item.warning ? `<div class="warning">\u26A0\uFE0F ${item.warning}</div>` : ''}
          </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderTopicCard(topic, platformKey) {
  const { angle, hook } = parseIdea(topic.idea);
  const link = topic.link || getPlatformSearchURL(platformKey, topic.title || topic.hotspot);
  const type = topic.type === 'B' ? 'B' : 'A';
  const typeLabel = type === 'B' ? 'B轨·社会情绪' : 'A轨·热点借势';
  const metaHtml = (topic.target_audience || topic.scene) ? `
    <div class="topic-meta">
      ${topic.target_audience ? `<span class="meta-item"><span class="meta-label">人群：</span>${topic.target_audience}</span>` : ''}
      ${topic.scene ? `<span class="meta-item"><span class="meta-label">场景：</span>${topic.scene}</span>` : ''}
    </div>
  ` : '';
  return `
    <div class="topic-card">
      <a class="card-link" href="${link}" target="_blank" rel="noopener"></a>
      <span class="link-hint">↗</span>
      <div>
        <span class="hotspot-tag">${topic.hotspot}</span>
        <span class="heat">${topic.heat}</span>
        <span class="priority-badge priority-${topic.priority || 'P3'}">${topic.priority || 'P3'}</span>
        <span class="type-badge type-${type}">${typeLabel}</span>
      </div>
      ${metaHtml}
      <div class="idea">
        ${angle ? `<div class="idea-angle"><span class="idea-label">选题角度</span>${angle}</div>` : ''}
        ${hook ? `<div class="idea-hook"><span class="idea-label">内容钩子</span>${hook}</div>` : ''}
      </div>
      <div class="desc">${topic.desc}</div>
      <div class="formula">📐 ${topic.formula}</div>
    </div>
  `;
}

function renderPlatform(key, platform, track) {
  // 按 A/B 轨过滤话题；旧数据无 type 字段时默认归为 A 轨
  const filteredCategories = platform.categories.map(cat => {
    const filteredTopics = cat.topics.filter(topic => (topic.type || 'A') === track);
    if (filteredTopics.length === 0) return null;
    return { ...cat, topics: filteredTopics };
  }).filter(Boolean);

  if (filteredCategories.length === 0) return '';

  const categories = filteredCategories.map(cat => `
    <div class="category-title">${cat.title}</div>
    <div class="topics-grid">
      ${cat.topics.map(topic => renderTopicCard(topic, key)).join('')}
    </div>
  `).join('');
  return `<div class="platform-panel" id="panel-${track}-${key}">${categories}</div>`;
}

function slugifyDirection(title) {
  return title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '');
}

function aggregateDirections(platforms, track) {
  const directions = {};
  Object.keys(platforms).forEach(platformKey => {
    const platform = platforms[platformKey];
    platform.categories.forEach(cat => {
      cat.topics.forEach(topic => {
        if ((topic.type || 'A') !== track) return;
        if (!directions[cat.title]) {
          directions[cat.title] = { title: cat.title, topics: [], _seen: new Set() };
        }
        const seen = directions[cat.title]._seen;
        const key = topic.hotspot || topic.title || JSON.stringify(topic);
        if (seen.has(key)) return;
        seen.add(key);
        directions[cat.title].topics.push({ ...topic, _platformKey: platformKey });
      });
    });
  });
  Object.values(directions).forEach(dir => delete dir._seen);
  return directions;
}

function renderDirectionPanel(title, topics, track) {
  const key = slugifyDirection(title);
  return `
    <div class="platform-panel" id="panel-${track}-${key}">
      <div class="category-title">${title}</div>
      <div class="topics-grid">
        ${topics.map(topic => renderTopicCard(topic, topic._platformKey || 'cross')).join('')}
      </div>
    </div>
  `;
}

function renderRisks(risks) {
  return `
    <div class="risk-section">
      <h3>🚨 风险红线提醒</h3>
      ${risks.map(r => `
        <div class="risk-item"><strong>${r.title}：</strong>${r.desc}</div>
      `).join('')}
    </div>
  `;
}

function renderHotlist(platforms, weekDate) {
  const platformNames = { douyin: '抖音热榜', bilibili: 'B站排行榜', xiaohongshu: '小红书热点', cross: '跨平台热点' };
  const hotlistData = HOTLIST_DATA[weekDate] || {};
  const platformSections = Object.keys(platforms).map(key => {
    const items = hotlistData[key] || [];
    if (items.length === 0) return '';
    const itemsHtml = items.map(item => {
      const url = item.url || getPlatformSearchURL(key, item.title);
      return `<a class="hotlist-item" href="${url}" target="_blank" rel="noopener">${item.title}<span class="hot-heat">${item.heat}</span></a>`;
    }).join('');
    return `
      <div class="hotlist-platform">
        <h4>${platformNames[key] || platforms[key].name}</h4>
        <div class="hotlist-items">${itemsHtml}</div>
      </div>
    `;
  }).join('');
  if (!platformSections.trim()) return '';
  return `
    <div class="hotlist-section">
      <h3>📊 本周各平台热榜数据来源</h3>
      ${platformSections}
    </div>
  `;
}

function countTopicsByTrack(platforms, track) {
  const result = {};
  Object.keys(platforms).forEach(key => {
    const platform = platforms[key];
    let count = 0;
    platform.categories.forEach(cat => {
      cat.topics.forEach(topic => {
        if ((topic.type || 'A') === track) count++;
      });
    });
    if (count > 0) result[key] = { platform, count };
  });
  return result;
}

function renderData(data) {
  const tracks = [
    { key: 'A', label: '热点借势' },
    { key: 'B', label: '社会情绪' }
  ];

  const trackViews = tracks.map((track, trackIndex) => {
    const directions = aggregateDirections(data.platforms, track.key);
    const directionKeys = Object.keys(directions);

    if (directionKeys.length === 0) {
      return `
        <div class="track-view ${trackIndex === 0 ? 'active' : ''}" id="track-view-${track.key}">
          <div class="track-empty">本周暂无「${track.label}」相关选题</div>
        </div>
      `;
    }

    const directionTabs = directionKeys.map((key, i) => {
      const dir = directions[key];
      return `<button class="platform-tab ${i === 0 ? 'active' : ''}" data-track="${track.key}" data-platform="${slugifyDirection(key)}">${dir.title}（${dir.topics.length}条）</button>`;
    }).join('');

    const panels = directionKeys.map((key, i) => {
      const html = renderDirectionPanel(directions[key].title, directions[key].topics, track.key);
      return html.replace('class="platform-panel"', `class="platform-panel ${i === 0 ? 'active' : ''}"`);
    }).join('');

    return `
      <div class="track-view ${trackIndex === 0 ? 'active' : ''}" id="track-view-${track.key}">
        <div class="platform-tabs active">${directionTabs}</div>
        ${panels}
      </div>
    `;
  }).join('');

  const trackTabs = tracks.map((track, i) => {
    const directions = aggregateDirections(data.platforms, track.key);
    const totalCount = Object.keys(directions).reduce((sum, k) => sum + directions[k].topics.length, 0);
    return `<button class="track-tab ${i === 0 ? 'active' : ''}" data-track="${track.key}">${track.label}<span class="count">${totalCount}条</span></button>`;
  }).join('');

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = `
    ${renderTop3(data.top3)}
    <div class="track-tabs">${trackTabs}</div>
    ${trackViews}
    ${renderRisks(data.risks)}
    ${renderHotlist(data.platforms, data.date)}
    <div class="source-note">${data.source}</div>
  `;

  // 一级 A/B 轨切换
  contentEl.querySelectorAll('.track-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const track = btn.dataset.track;
      contentEl.querySelectorAll('.track-tab').forEach(b => b.classList.remove('active'));
      contentEl.querySelectorAll('.track-view').forEach(v => v.classList.remove('active'));
      contentEl.querySelectorAll('.platform-tabs').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const view = document.getElementById(`track-view-${track}`);
      view.classList.add('active');
      const tabs = view.querySelector('.platform-tabs');
      if (tabs) tabs.classList.add('active');
    });
  });

  // 二级平台/方向切换
  contentEl.querySelectorAll('.platform-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const track = btn.dataset.track;
      const platform = btn.dataset.platform;
      const view = document.getElementById(`track-view-${track}`);
      view.querySelectorAll('.platform-tab').forEach(b => b.classList.remove('active'));
      view.querySelectorAll('.platform-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${track}-${platform}`).classList.add('active');
    });
  });
}
function loadWeek(key) {
  const contentEl = document.getElementById('content');
  const data = EMBEDDED_DATA[key];
  if (data) {
    renderData(data);
  } else {
    contentEl.innerHTML = '<div class="loading">未找到该周数据</div>';
  }
}

function init() {
  const select = document.getElementById('weekSelect');
  select.innerHTML = weekIndex.map((w, i) => `<option value="${w.file}" ${i === 0 ? 'selected' : ''}>${w.label}</option>`).join('');

  select.addEventListener('change', () => {
    if (select.value) loadWeek(select.value);
  });

  if (weekIndex.length > 0) {
    loadWeek(weekIndex[0].file);
  }
}

init();
</script>
</body>
</html>
